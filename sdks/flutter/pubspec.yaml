name: disnote_flutter
description: Flutter SDK, native renderer and secure editor bridge for DisNote documents.
version: 0.1.1
homepage: https://github.com/DisNote-Project/DisNote-Document-Library
repository: https://github.com/DisNote-Project/DisNote-Document-Library/tree/main/sdks/flutter
issue_tracker: https://github.com/DisNote-Project/DisNote-Document-Library/issues
documentation: "https://github.com/DisNote-Project/DisNote-Document-Library/tree/main/sdks/flutter#readme"
topics:
  - documents
  - editor
  - flutter-web
  - rich-text

platforms:
  android:
  ios:
  web:

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.50.0"

dependencies:
  crypto: ^3.0.6
  flutter:
    sdk: flutter
  http: ^1.2.2
  material_ui: ^1.11.1
  web: ^1.1.1
  webview_flutter: ^4.10.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
